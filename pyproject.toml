[project]
name = "prpa"
version = "0.1.0"
description = "Portfolio Risk & Performance Analyzer: diversified ETF portfolio vs SPY"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "plotly>=5.0", "streamlit>=1.30", "yfinance>=0.2.40"]
[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "playwright>=1.40"]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
